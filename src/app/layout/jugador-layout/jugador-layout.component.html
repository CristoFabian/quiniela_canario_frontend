<div class="jugador-shell" [class.sidebar-open]="sidebarOpen">

  <header class="mobile-topbar">
    <button type="button" class="hamburger" (click)="toggleSidebar()" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
    <span class="mobile-topbar__title">La Quiniela del Canario</span>
    <app-notification-bell class="mobile-topbar__bell"></app-notification-bell>
  </header>

  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/img/logo.png" alt="Logo Quiniela del Canario" class="brand-logo">
      <div>
        <span class="brand-name">La Quiniela del Canario</span>
        <span class="brand-sub">Juega con responsabilidad</span>
      </div>
      <button type="button" class="sidebar-close" (click)="closeSidebar()" aria-label="Cerrar menú"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/jugador" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-house"></i></span><span>Inicio</span>
      </a>
      <a routerLink="/jugador/quinielas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-bullseye"></i></span><span>Quinielas</span>
      </a>
      <a routerLink="/jugador/mis-jugadas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-ticket"></i></span><span>Mis Jugadas</span>
      </a>
      <a routerLink="/jugador/pagar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-credit-card"></i></span><span>Pagar</span>
      </a>
      <a routerLink="/jugador/mis-pagos" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-clipboard-list"></i></span><span>Mis Pagos</span>
      </a>
      <a routerLink="/jugador/mis-premios" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-trophy"></i></span><span>Mis Premios</span>
      </a>
      <a routerLink="/jugador/notificaciones" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-bell"></i></span><span>Notificaciones</span>
      </a>
      <a routerLink="/jugador/reglas" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fa-solid fa-scroll"></i></span><span>Reglas del Juego</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/jugador/perfil" routerLinkActive="active" class="user-info" title="Ver mi perfil">
        <span class="user-avatar">
          @if (fotoUrl) {
            <img [src]="fotoUrl" alt="Foto de perfil" class="user-avatar-img">
          } @else {
            <i class="fa-solid fa-user"></i>
          }
        </span>
        <span class="user-name">{{ username }}</span>
        <span class="user-info-arrow"><i class="fa-solid fa-chevron-right"></i></span>
      </a>
      @if (saldoAFavor > 0) {
        <div class="user-saldo">
          <span class="saldo-icon"><i class="fa-solid fa-sack-dollar"></i></span>
          <span class="saldo-monto">Saldo a favor: ${{ saldoAFavor | number:'1.2-2' }}</span>
        </div>
      }
      <button class="btn-logout" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="desktop-topbar">
      <app-notification-bell></app-notification-bell>
    </div>
    <router-outlet></router-outlet>
  </main>

</div>
